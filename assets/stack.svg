<svg width="480" height="360" viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <style>
      .bg { fill: #0d1117; }
      .title { fill: #c9d1d9; font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; }
      .label { fill: #c9d1d9; font-family: 'Segoe UI', sans-serif; font-size: 13px; }
      .pct { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 12px; }
      .track { fill: #21262d; }
      .bar { fill: url(#barGrad); }
      @keyframes grow {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .row { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
      .bar { transform-origin: left; animation: grow 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    </style>
  </defs>

  <rect class="bg" width="480" height="360" rx="14"/>
  <text x="24" y="34" class="title">💻 Tech Stack Breakdown</text>

  <!-- Python -->
  <g class="row" style="animation-delay:0.05s">
    <text x="24" y="66" class="label">Python</text>
    <text x="440" y="66" class="pct" text-anchor="end">90%</text>
    <rect class="track" x="24" y="74" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="74" width="374" height="8" rx="4" style="animation-delay:0.15s"/>
  </g>

  <!-- LangChain / LangGraph -->
  <g class="row" style="animation-delay:0.15s">
    <text x="24" y="104" class="label">LangChain / LangGraph</text>
    <text x="440" y="104" class="pct" text-anchor="end">85%</text>
    <rect class="track" x="24" y="112" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="112" width="354" height="8" rx="4" style="animation-delay:0.25s"/>
  </g>

  <!-- SQL -->
  <g class="row" style="animation-delay:0.25s">
    <text x="24" y="142" class="label">SQL</text>
    <text x="440" y="142" class="pct" text-anchor="end">75%</text>
    <rect class="track" x="24" y="150" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="150" width="312" height="8" rx="4" style="animation-delay:0.35s"/>
  </g>

  <!-- RAG / Vector DBs -->
  <g class="row" style="animation-delay:0.35s">
    <text x="24" y="180" class="label">RAG / Vector DBs (FAISS, Pinecone)</text>
    <text x="440" y="180" class="pct" text-anchor="end">85%</text>
    <rect class="track" x="24" y="188" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="188" width="354" height="8" rx="4" style="animation-delay:0.45s"/>
  </g>

  <!-- Docker / MLOps -->
  <g class="row" style="animation-delay:0.45s">
    <text x="24" y="218" class="label">Docker / MLOps (MLflow)</text>
    <text x="440" y="218" class="pct" text-anchor="end">70%</text>
    <rect class="track" x="24" y="226" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="226" width="291" height="8" rx="4" style="animation-delay:0.55s"/>
  </g>

  <!-- FastAPI / Streamlit -->
  <g class="row" style="animation-delay:0.55s">
    <text x="24" y="256" class="label">FastAPI / Streamlit</text>
    <text x="440" y="256" class="pct" text-anchor="end">65%</text>
    <rect class="track" x="24" y="264" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="264" width="270" height="8" rx="4" style="animation-delay:0.65s"/>
  </g>

  <!-- Azure Data Factory -->
  <g class="row" style="animation-delay:0.65s">
    <text x="24" y="294" class="label">Azure Data Factory</text>
    <text x="440" y="294" class="pct" text-anchor="end">55%</text>
    <rect class="track" x="24" y="302" width="416" height="8" rx="4"/>
    <rect class="bar" x="24" y="302" width="229" height="8" rx="4" style="animation-delay:0.75s"/>
  </g>

  <text x="24" y="336" class="pct">Bars animate on load • updated manually, not pulled from live commit data</text>
</svg>
