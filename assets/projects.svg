<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#161033"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bgGrad); }
      .frame { fill: none; stroke: #1f2a44; stroke-width: 1.5; }
      .term-title { fill: #58a6ff; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .term-sub { fill: #6e7681; font-family: 'Courier New', monospace; font-size: 12px; }
      .pin-count { fill: #6e7681; font-family: 'Courier New', monospace; font-size: 12px; }
      .card { fill: #0f1626; stroke: #22304a; stroke-width: 1; }
      .name { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; }
      .desc { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 11.5px; }
      .lang-dot { }
      .lang-label { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
      .ring-bg { fill: none; stroke: #21262d; stroke-width: 5; }
      .ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 5; stroke-linecap: round; }
      .ring-pct { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; }
      .status-dot { fill: #3fb950; }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes ringFill {
        from { stroke-dashoffset: 163.36; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .card-group { animation: cardIn 0.55s cubic-bezier(.22,1,.36,1) forwards; opacity: 0; }
      .ring-fg { animation: ringFill 1.3s cubic-bezier(.22,1,.36,1) forwards; }
      .status-dot { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <rect class="bg" width="700" height="520" rx="16"/>
  <rect class="frame" x="1" y="1" width="698" height="518" rx="16"/>

  <!-- terminal header -->
  <text x="28" y="38" class="term-title">PROJECTS.LIST</text>
  <text x="150" y="38" class="term-sub">./projects.sh --all</text>
  <text x="672" y="38" class="pin-count" text-anchor="end">4 pinned</text>
  <line x1="28" y1="52" x2="672" y2="52" stroke="#1f2a44" stroke-width="1"/>

  <!-- CARD 1 -->
  <g class="card-group" style="animation-delay:0.05s">
    <rect class="card" x="28" y="72" width="316" height="190" rx="12"/>
    <circle class="status-dot" cx="322" cy="90" r="4"/>
    <text x="48" y="96" class="lang-label">Isolated Multi-Bot RAG System</text>
    <text x="48" y="122" class="name">Multi-Bot RAG</text>
    <text x="48" y="142" class="desc">Isolated knowledge bases for 10+</text>
    <text x="48" y="157" class="desc">bots via Pinecone namespaces +</text>
    <text x="48" y="172" class="desc">LangGraph routing, ~30% fewer</text>
    <text x="48" y="187" class="desc">hallucinations via retry scoring.</text>
    <circle class="ring-bg" cx="288" cy="200" r="26"/>
    <circle class="ring-fg" cx="288" cy="200" r="26" stroke-dasharray="163.36" stroke-dashoffset="13.07" transform="rotate(-90 288 200)" style="animation-delay:0.3s"/>
    <text x="288" y="204" class="ring-pct" text-anchor="middle">92%</text>
    <circle cx="48" cy="234" r="5" fill="#3572A5"/>
    <text x="60" y="238" class="lang-label">Python · LangGraph · Pinecone</text>
  </g>

  <!-- CARD 2 -->
  <g class="card-group" style="animation-delay:0.15s">
    <rect class="card" x="356" y="72" width="316" height="190" rx="12"/>
    <circle class="status-dot" cx="650" cy="90" r="4"/>
    <text x="376" y="96" class="lang-label">AI Email Summary Job Agent</text>
    <text x="376" y="122" class="name">Job Alert Bot</text>
    <text x="376" y="142" class="desc">Monitors Gmail via OAuth2, runs</text>
    <text x="376" y="157" class="desc">LLM-based classification, and</text>
    <text x="376" y="172" class="desc">pushes structured Telegram alerts</text>
    <text x="376" y="187" class="desc">every 15 min via GitHub Actions.</text>
    <circle class="ring-bg" cx="616" cy="200" r="26"/>
    <circle class="ring-fg" cx="616" cy="200" r="26" stroke-dasharray="163.36" stroke-dashoffset="19.60" transform="rotate(-90 616 200)" style="animation-delay:0.4s"/>
    <text x="616" y="204" class="ring-pct" text-anchor="middle">88%</text>
    <circle cx="376" cy="234" r="5" fill="#3572A5"/>
    <text x="388" y="238" class="lang-label">Python · Gmail API · GH Actions</text>
  </g>

  <!-- CARD 3 -->
  <g class="card-group" style="animation-delay:0.25s">
    <rect class="card" x="28" y="278" width="316" height="190" rx="12"/>
    <circle class="status-dot" cx="322" cy="296" r="4"/>
    <text x="48" y="302" class="lang-label">RAG Chatbot · Bedrock AgentCore</text>
    <text x="48" y="328" class="name">Fitness RAG Bot</text>
    <text x="48" y="348" class="desc">FAISS search over 500+ chunks,</text>
    <text x="48" y="363" class="desc">Llama-3.3-70B via LangChain on</text>
    <text x="48" y="378" class="desc">Bedrock AgentCore, cross-session</text>
    <text x="48" y="393" class="desc">memory, Docker + ECR deploy.</text>
    <circle class="ring-bg" cx="288" cy="406" r="26"/>
    <circle class="ring-fg" cx="288" cy="406" r="26" stroke-dasharray="163.36" stroke-dashoffset="16.34" transform="rotate(-90 288 406)" style="animation-delay:0.5s"/>
    <text x="288" y="410" class="ring-pct" text-anchor="middle">90%</text>
    <circle cx="48" cy="440" r="5" fill="#3572A5"/>
    <text x="60" y="444" class="lang-label">Python · Bedrock · LangChain</text>
  </g>

  <!-- CARD 4 -->
  <g class="card-group" style="animation-delay:0.35s">
    <rect class="card" x="356" y="278" width="316" height="190" rx="12"/>
    <circle class="status-dot" cx="650" cy="296" r="4" fill="#8b949e" style="animation:none"/>
    <text x="376" y="302" class="lang-label">Production RAG Platform (Nvest)</text>
    <text x="376" y="328" class="name">Enterprise RAG</text>
    <text x="376" y="348" class="desc">Hybrid BM25 + vector retrieval</text>
    <text x="376" y="363" class="desc">on PostgreSQL/pgvector with</text>
    <text x="376" y="378" class="desc">multi-tenant isolation across</text>
    <text x="376" y="393" class="desc">multiple insurance clients.</text>
    <circle class="ring-bg" cx="616" cy="406" r="26"/>
    <circle class="ring-fg" cx="616" cy="406" r="26" stroke-dasharray="163.36" stroke-dashoffset="8.17" transform="rotate(-90 616 406)" style="animation-delay:0.6s"/>
    <text x="616" y="410" class="ring-pct" text-anchor="middle">95%</text>
    <circle cx="376" cy="440" r="5" fill="#336791"/>
    <text x="388" y="444" class="lang-label">Python · pgvector · Multi-tenant</text>
  </g>

  <text x="28" y="500" class="term-sub">private/enterprise repos shown for portfolio reference only</text>
</svg>
