<svg width="700" height="110" viewBox="0 0 700 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#161033"/>
    </linearGradient>
    <style>
      .bg { fill: url(#socialBg); }
      .frame { fill: none; stroke: #1f2a44; stroke-width: 1.5; }
      .pill { stroke-width: 1.4; }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; }
      .glyph { font-family: 'Segoe UI', sans-serif; font-weight: 700; }

      @keyframes popIn {
        0% { opacity: 0; transform: translateY(10px) scale(0.92); }
        70% { opacity: 1; transform: translateY(-2px) scale(1.03); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0px currentColor); }
        50% { filter: drop-shadow(0 0 5px currentColor); }
      }
      .item { animation: popIn 0.5s cubic-bezier(.22,1,.36,1) forwards; opacity: 0; transform-origin: center; }
      .icon-circle { animation: glow 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="700" height="110" rx="16"/>
  <rect class="frame" x="1" y="1" width="698" height="108" rx="16"/>

  <!-- Instagram -->
  <g class="item" style="animation-delay:0.05s">
    <a href="https://instagram.com/piyush_29__">
      <rect class="pill icon-circle" x="28" y="30" width="130" height="50" rx="25" fill="#1a1030" stroke="#E4405F" style="color:#E4405F"/>
      <circle cx="60" cy="55" r="12" fill="none" stroke="#E4405F" stroke-width="2"/>
      <circle cx="60" cy="55" r="4.5" fill="none" stroke="#E4405F" stroke-width="2"/>
      <circle cx="70" cy="45" r="1.8" fill="#E4405F"/>
      <text x="82" y="60" class="label" fill="#e6edf3">Instagram</text>
    </a>
  </g>

  <!-- LinkedIn -->
  <g class="item" style="animation-delay:0.15s">
    <a href="https://linkedin.com/in/piyushsuryawanshi">
      <rect class="pill icon-circle" x="178" y="30" width="130" height="50" rx="25" fill="#1a1030" stroke="#0A66C2" style="color:#0A66C2"/>
      <rect x="199" y="47" width="6" height="16" fill="#0A66C2"/>
      <circle cx="202" cy="42" r="3" fill="#0A66C2"/>
      <path d="M212 63 v-9 c0-4 2-6 5-6 s5 2 5 6 v9 h-6 v-8 c0-2-1-3-2-3 s-2 1-2 3 v8 z" fill="#0A66C2"/>
      <text x="232" y="60" class="label" fill="#e6edf3">LinkedIn</text>
    </a>
  </g>

  <!-- X -->
  <g class="item" style="animation-delay:0.25s">
    <a href="https://x.com/piyush__29">
      <rect class="pill icon-circle" x="328" y="30" width="90" height="50" rx="25" fill="#1a1030" stroke="#e6edf3" style="color:#e6edf3"/>
      <text x="360" y="62" class="glyph" font-size="20" fill="#e6edf3" text-anchor="middle">𝕏</text>
      <text x="382" y="60" class="label" fill="#e6edf3">X</text>
    </a>
  </g>

  <!-- Email -->
  <g class="item" style="animation-delay:0.35s">
    <a href="mailto:piyush29suryawanshi@gmail.com">
      <rect class="pill icon-circle" x="438" y="30" width="120" height="50" rx="25" fill="#1a1030" stroke="#D14836" style="color:#D14836"/>
      <rect x="458" y="47" width="20" height="14" rx="2" fill="none" stroke="#D14836" stroke-width="2"/>
      <path d="M458 48 l10 8 l10 -8" fill="none" stroke="#D14836" stroke-width="2"/>
      <text x="490" y="60" class="label" fill="#e6edf3">Email</text>
    </a>
  </g>
</svg>
