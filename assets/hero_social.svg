<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#161033"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="70" cy="66" r="42"/>
    </clipPath>
    <style>
      .bg { fill: url(#heroBg); }
      .frame { fill: none; stroke: #1f2a44; stroke-width: 1.5; }
      .divider { stroke: #1f2a44; stroke-width: 1; }
      .handle { fill: #6e7681; font-family: 'Courier New', monospace; font-size: 13px; }
      .name { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 24px; font-weight: 800; }
      .title { fill: #00d9ff; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .card { fill: #0f1626; stroke: url(#cardBorder); stroke-width: 1.3; }
      .card-label { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; }
      .card-sub { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 10px; }
      .pill { stroke-width: 1.4; }
      .label { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; }
      .glyph { font-family: 'Segoe UI', sans-serif; font-weight: 700; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.85); }
        70% { opacity: 1; transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes ringSpin {
        from { stroke-dashoffset: 220; }
        to { stroke-dashoffset: 40; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0px currentColor); }
        50% { filter: drop-shadow(0 0 5px currentColor); }
      }
      .fu { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
      .pop { animation: popIn 0.55s cubic-bezier(.22,1,.36,1) forwards; opacity: 0; transform-origin: center; }
      .avatar-ring { animation: ringSpin 1.4s ease-out forwards; }
      .icon-circle { animation: glow 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- one continuous background / frame for the whole box -->
  <rect class="bg" width="700" height="330" rx="16"/>
  <rect class="frame" x="1" y="1" width="698" height="328" rx="16"/>

  <!-- ===== HERO HEADER ===== -->
  <g class="fu" style="animation-delay:0.05s">
    <circle class="avatar-ring" cx="70" cy="66" r="48" fill="none" stroke="#00d9ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <image href="https://github.com/Piyush-0629.png" x="28" y="24" width="84" height="84" clip-path="url(#avatarClip)"/>
    <circle cx="70" cy="66" r="42" fill="none" stroke="#1f2a44" stroke-width="2"/>
  </g>

  <g class="fu" style="animation-delay:0.15s">
    <text x="132" y="42" class="handle">@Piyush-0629</text>
    <text x="132" y="70" class="name">Piyush Kumar Suryawanshi</text>
    <text x="132" y="92" class="title">AI/ML ENGINEER</text>
  </g>

  <!-- ===== TYPING ANIMATION (behind the header, before cards) ===== -->
  <g class="fu" style="animation-delay:0.25s">
    <image href="https://readme-typing-svg.demolab.com?font=Fira+Code&amp;pause=1000&amp;color=00D9FF&amp;center=true&amp;vCenter=true&amp;width=640&amp;height=40&amp;lines=Building+Production-Grade+RAG+Systems;Designing+Multi-Agent+LLM+Pipelines;Automating+the+Boring+Stuff+with+GenAI"
           x="30" y="112" width="640" height="40"/>
  </g>

  <line x1="28" y1="160" x2="672" y2="160" class="divider"/>

  <!-- ===== SKILL CARDS ===== -->
  <g class="pop" style="animation-delay:0.35s">
    <rect class="card" x="28" y="176" width="200" height="46" rx="10"/>
    <circle cx="52" cy="199" r="5" fill="#00d9ff"/>
    <text x="68" y="196" class="card-label">RAG</text>
    <text x="68" y="210" class="card-sub">Retrieval-Augmented Generation</text>
  </g>

  <g class="pop" style="animation-delay:0.45s">
    <rect class="card" x="250" y="176" width="200" height="46" rx="10"/>
    <circle cx="274" cy="199" r="5" fill="#7f5af0"/>
    <text x="290" y="196" class="card-label">GenAI</text>
    <text x="290" y="210" class="card-sub">LLM Apps &amp; Agentic Workflows</text>
  </g>

  <g class="pop" style="animation-delay:0.55s">
    <rect class="card" x="472" y="176" width="200" height="46" rx="10"/>
    <circle cx="496" cy="199" r="5" fill="#ff6b9d"/>
    <text x="512" y="196" class="card-label">Machine Learning</text>
    <text x="512" y="210" class="card-sub">Predictive Models &amp; MLOps</text>
  </g>

  <line x1="28" y1="240" x2="672" y2="240" class="divider"/>

  <!-- ===== SOCIAL LINKS (bottom of the same box) ===== -->
  <g class="pop" style="animation-delay:0.65s">
    <a href="https://instagram.com/piyush_29__">
      <rect class="pill icon-circle" x="85" y="256" width="130" height="50" rx="25" fill="#1a1030" stroke="#E4405F" style="color:#E4405F"/>
      <circle cx="117" cy="281" r="12" fill="none" stroke="#E4405F" stroke-width="2"/>
      <circle cx="117" cy="281" r="4.5" fill="none" stroke="#E4405F" stroke-width="2"/>
      <circle cx="127" cy="271" r="1.8" fill="#E4405F"/>
      <text x="139" y="286" class="label">Instagram</text>
    </a>
  </g>

  <g class="pop" style="animation-delay:0.72s">
    <a href="https://linkedin.com/in/piyushsuryawanshi">
      <rect class="pill icon-circle" x="235" y="256" width="130" height="50" rx="25" fill="#1a1030" stroke="#0A66C2" style="color:#0A66C2"/>
      <rect x="256" y="273" width="6" height="16" fill="#0A66C2"/>
      <circle cx="259" cy="268" r="3" fill="#0A66C2"/>
      <path d="M269 289 v-9 c0-4 2-6 5-6 s5 2 5 6 v9 h-6 v-8 c0-2-1-3-2-3 s-2 1-2 3 v8 z" fill="#0A66C2"/>
      <text x="289" y="286" class="label">LinkedIn</text>
    </a>
  </g>

  <g class="pop" style="animation-delay:0.79s">
    <a href="https://x.com/piyush__29">
      <rect class="pill icon-circle" x="385" y="256" width="90" height="50" rx="25" fill="#1a1030" stroke="#e6edf3" style="color:#e6edf3"/>
      <text x="417" y="288" class="glyph" font-size="20" fill="#e6edf3" text-anchor="middle">𝕏</text>
      <text x="439" y="286" class="label">X</text>
    </a>
  </g>

  <g class="pop" style="animation-delay:0.86s">
    <a href="mailto:piyush29suryawanshi@gmail.com">
      <rect class="pill icon-circle" x="495" y="256" width="120" height="50" rx="25" fill="#1a1030" stroke="#D14836" style="color:#D14836"/>
      <rect x="515" y="273" width="20" height="14" rx="2" fill="none" stroke="#D14836" stroke-width="2"/>
      <path d="M515 274 l10 8 l10 -8" fill="none" stroke="#D14836" stroke-width="2"/>
      <text x="547" y="286" class="label">Email</text>
    </a>
  </g>
</svg>
