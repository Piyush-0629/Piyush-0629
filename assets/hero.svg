<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#161033"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="70" cy="66" r="42"/>
    </clipPath>
    <style>
      .bg { fill: url(#heroBg); }
      .frame { fill: none; stroke: #1f2a44; stroke-width: 1.5; }
      .handle { fill: #6e7681; font-family: 'Courier New', monospace; font-size: 13px; }
      .name { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 24px; font-weight: 800; }
      .title { fill: #00d9ff; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .tagline { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 13px; }
      .card { fill: #0f1626; stroke: url(#cardBorder); stroke-width: 1.3; }
      .card-label { fill: #e6edf3; font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; }
      .card-sub { fill: #8b949e; font-family: 'Segoe UI', sans-serif; font-size: 10px; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.85); }
        70% { opacity: 1; transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes ringSpin {
        from { stroke-dashoffset: 220; }
        to { stroke-dashoffset: 40; }
      }
      .fu { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
      .pop { animation: popIn 0.55s cubic-bezier(.22,1,.36,1) forwards; opacity: 0; transform-origin: center; }
      .avatar-ring { animation: ringSpin 1.4s ease-out forwards; }
    </style>
  </defs>

  <rect class="bg" width="700" height="220" rx="16"/>
  <rect class="frame" x="1" y="1" width="698" height="218" rx="16"/>

  <!-- Avatar (live GitHub profile photo) -->
  <g class="fu" style="animation-delay:0.05s">
    <circle class="avatar-ring" cx="70" cy="66" r="48" fill="none" stroke="#00d9ff" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <image href="https://github.com/Piyush-0629.png" x="28" y="24" width="84" height="84" clip-path="url(#avatarClip)"/>
    <circle cx="70" cy="66" r="42" fill="none" stroke="#1f2a44" stroke-width="2"/>
  </g>

  <!-- Handle + name + title + tagline -->
  <g class="fu" style="animation-delay:0.15s">
    <text x="132" y="42" class="handle">@Piyush-0629</text>
    <text x="132" y="70" class="name">Piyush Kumar Suryawanshi</text>
    <text x="132" y="92" class="title">AI/ML ENGINEER</text>
    <text x="132" y="112" class="tagline">Automating the boring stuff with GenAI.</text>
  </g>

  <line x1="28" y1="140" x2="672" y2="140" stroke="#1f2a44" stroke-width="1"/>

  <!-- Skill cards: RAG / GenAI / Machine Learning -->
  <g class="pop" style="animation-delay:0.35s">
    <rect class="card" x="28" y="158" width="200" height="46" rx="10"/>
    <circle cx="52" cy="181" r="5" fill="#00d9ff"/>
    <text x="68" y="178" class="card-label">RAG</text>
    <text x="68" y="192" class="card-sub">Agentic-RAG, Adaptive RAG</text>
  </g>

  <g class="pop" style="animation-delay:0.45s">
    <rect class="card" x="250" y="158" width="200" height="46" rx="10"/>
    <circle cx="274" cy="181" r="5" fill="#7f5af0"/>
    <text x="290" y="178" class="card-label">GenAI</text>
    <text x="290" y="192" class="card-sub">LLM Apps &amp; Agentic Workflows</text>
  </g>

  <g class="pop" style="animation-delay:0.55s">
    <rect class="card" x="472" y="158" width="200" height="46" rx="10"/>
    <circle cx="496" cy="181" r="5" fill="#ff6b9d"/>
    <text x="512" y="178" class="card-label">Machine Learning</text>
    <text x="512" y="192" class="card-sub">Predictive Models &amp; MLOps</text>
  </g>
</svg>
